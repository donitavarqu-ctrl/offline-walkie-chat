name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.example --project-name offline_walkie_chat . --platforms=android
          cp -r android ../
          cd ..
          rm -rf temp_app

      - name: Set minSdk to 23
        run: |
          find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' {} +
          find android/ -name "build.gradle" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' {} +

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        id: build_step
        continue-on-error: true
        run: |
          flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK Artifact
        if: steps.build_step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: offline-walkie-app
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Auto-Fix via Gemini AI
        if: steps.build_step.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ERROR_SUMMARY=$(tail -n 60 build.log)
          PROMPT="Fix the following Flutter Android build error. Return actionable bash commands or file replacements: $ERROR_SUMMARY"
          
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"contents\": [{\"parts\": [{\"text\": $(echo "$PROMPT" | jq -R -s .)}]}]}")
          
          echo "$RESPONSE" > ai_fix_log.json
          git config --global user.name "Gemini-AutoFix"
          git config --global user.email "gemini-bot@actions.github.com"
          git add -A
          git commit -m "🤖 AI Auto-Fix Log: Captured error details" || true
          git push || true
          exit 1
